# CI (step 10.5): on every push to main and every pull request, prove the code still works.
#
#   checks  format, lint, typecheck: fast, no database.
#   tests   build the app once, then the race tests and the API tests against throwaway
#           Postgres 17 + Redis 8 containers (the same images as docker-compose.yml).
#
# Both jobs run at the same time on separate fresh Linux machines. A step that exits non-zero
# fails its job, and a failed job turns the commit/PR red.
#
# Nothing here reaches Supabase or Upstash: the tests TRUNCATE tables and FLUSHDB Redis, so they
# only ever see the service containers below. No repository secrets are needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # a "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow's token can only read the repo (it pushes, comments and deploys nothing).
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # prisma.config.ts requires it even for `prisma generate`; nothing connects to it here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # "packageManager": "bun@1.3.14"
      # Next.js and ESLint run on Node (their bins start with `#!/usr/bin/env node`).
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache Bun's package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile: fail if package.json and bun.lock disagree, never silently update.
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  tests:
    name: Race + API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Started before the first step; the job waits until both health checks pass. Port mapping
    # makes them reachable as localhost from the steps. Thrown away when the job ends.
    services:
      postgres:
        image: postgres:17-alpine # keep equal to docker-compose.yml (Supabase runs 17)
        env:
          POSTGRES_USER: hacker
          POSTGRES_PASSWORD: hacker
          POSTGRES_DB: hacker_house_test # the name must end in _test (assertTestDatabase)
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hacker -d hacker_house_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # The tests derive their URLs from these (tests/config/env.ts): database hacker_house_test,
      # Redis database 1. They start the app on :3100 with the same values.
      DATABASE_URL: postgresql://hacker:hacker@localhost:5432/hacker_house_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache Bun's package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Next's own build cache: unchanged pages/modules aren't recompiled. A new key per commit
      # (exact hits are rare); restore-keys picks the newest older one.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      # A production build refuses .env.example's dev secret, and this run is the only user of
      # the database, so a random one per run is enough. add-mask hides it in the logs;
      # $GITHUB_ENV hands it to every later step.
      - name: Generate a throwaway BETTER_AUTH_SECRET
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      # Built ONCE here. The package scripts test:race / test:api would each build again.
      - name: Build
        working-directory: apps/web
        run: bun x next build

      # Each test file migrates the test database itself (prisma migrate deploy: the same
      # migrations Supabase will run) and starts the built app on :3100.
      - name: Race tests
        working-directory: apps/web
        run: bun test ./tests/race

      - name: API tests
        working-directory: apps/web
        run: bun test ./tests/api
